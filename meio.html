<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Preferências Fooodhy</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap');

        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    text-decoration: none;
}

header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    padding: 20px 100px;
    background: #215a3a;
    display: flex;
    flex-direction: row;
    justify-content: center;
    z-index: 99;
}

header a {
    color: whitesmoke;
}

.logo {
    font-size: 30px;
}

body {
    min-height: 100vh;
    background: #f4fbf4;
    font-family: 'Manrope', sans-serif;
    color: #1b1b1b;
}

main {
    min-height: 100vh;
    padding: 130px 20px 40px;
    display: flex;
    justify-content: center;
    align-items: center;
}

.card {
    width: 100%;
    max-width: 680px;
    background: #ffffff;
    border: 1px solid #d7e7da;
    border-radius: 22px;
    padding: 34px;
    box-shadow: 0 12px 28px rgba(0, 0, 0, 0.10);
    text-align: center;
}

.card h1 {
    font-size: 30px;
    color: #153f2b;
    margin-bottom: 14px;
    line-height: 1.25;
}

.card p {
    font-size: 16px;
    color: #5d6b61;
    line-height: 1.5;
    margin-bottom: 24px;
}

.opcoes {
    display: grid;
    gap: 12px;
}

.btn {
    min-height: 48px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    font-weight: bold;
    padding: 12px 16px;
}

.btn1 {
    background: #215a3a;
    border: 2px solid #215a3a;
    color: #ffffff;
}

.btn1:hover {
    background: #18452d;
    border-color: #18452d;
}

.btn3,
.btn2 {
    background: #ffffff;
    border: 2px solid #b8d1bf;
    color: #215a3a;
}

.btn3:hover,
.btn2:hover {
    background: #eef6ef;
    border-color: #215a3a;
}

.card {
    animation: entrada-card 0.7s ease-out both;
}

@keyframes entrada-card {
    from {
        opacity: 0;
        transform: translateY(40px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

    </style>
    
</head>
<body>

    <header>
        <a class="logo" href="landing2.html"> Fooodhy </a>
    </header>

    <main>
        <section class="card">
            <h1>Você gostaria de fazer um quiz sobre suas preferências alimentares?</h1>
            <p>Assim conseguimos recomendar receitas mais alinhadas ao seu perfil e às suas preferências.</p>

            <div class="opcoes">
                <a class="btn btn1" href="quiz2.html">Sim, ir para o quiz</a>
                <a class="btn btn2" href="landing2.html">Não, voltar ao início</a>
                <a class="btn btn3" href="usuario.html">Não, página de usuário</a>
            </div>
        </section>
    </main>

</body>
</html>
